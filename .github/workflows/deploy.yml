name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The build regenerates the CSS Module declarations; the committed ones must match.
      - run: git diff --exit-code -- 'src/**/*.module.scss.d.ts'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 7

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # :latest for the compose file, the commit sha for the deploy job (and rollbacks by sha).
          tags: |
            ghcr.io/party-map/party-map-frontend:latest
            ghcr.io/party-map/party-map-frontend:${{ github.sha }}
          build-args: |
            PUBLIC_API_BASE=https://api.terkep.party/api
            PUBLIC_TILES_BASE=/tiles
            PUBLIC_KEYCLOAK_URL=https://auth.terkep.party
            PUBLIC_KEYCLOAK_REALM=party-map
            PUBLIC_KEYCLOAK_CLIENT_ID=partymap-web

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      # The key can only run /root/partymap/bin/deploy on the server (party-map-infra/deploy/README.md); the script
      # pulls the image tagged with this commit, swaps it in, waits for the health check, smoke-tests and rolls back.
      - name: Deploy this commit's image on the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || 'root@204.168.148.191' }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo "::error::the DEPLOY_SSH_KEY secret is missing (party-map-infra/deploy/README.md)"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/deploy_key
          # The server's public host key is committed in .github/deploy_known_hosts (strict checking, no TOFU).
          cp .github/deploy_known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          host=${DEPLOY_TARGET#*@}
          echo "trusting:"; ssh-keygen -lf ~/.ssh/known_hosts
          echo "the server presents:"; ssh-keyscan -t ed25519 "$host" 2>/dev/null | grep "^$host " | ssh-keygen -lf - || true
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "$DEPLOY_TARGET" "frontend ${{ github.sha }}"
