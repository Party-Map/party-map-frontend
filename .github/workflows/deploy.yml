name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The build regenerates the CSS Module declarations; the committed ones must match.
      - run: git diff --exit-code -- 'src/**/*.module.scss.d.ts'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 7

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/party-map/party-map-frontend:latest
          build-args: |
            PUBLIC_API_BASE=https://api.terkep.party/api
            PUBLIC_TILES_BASE=/tiles
            PUBLIC_KEYCLOAK_URL=https://auth.terkep.party
            PUBLIC_KEYCLOAK_REALM=party-map
            PUBLIC_KEYCLOAK_CLIENT_ID=partymap-web
