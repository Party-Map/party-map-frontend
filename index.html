<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#6d28d9" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
        <!-- The backend replaces the pm:head region with a page's own title, metadata and JSON-LD (see the shell
             routes in the README); keep the default title and description inside it. -->
        <!--pm:head-->
        <title>PartyMap</title>
        <meta name="description" content="Find your place at the party with PartyMap!" />
        <!--/pm:head-->
        <script>
            // Apply the theme before first paint (same rule as src/lib/theme.ts): the stored choice, else the system's.
            (function () {
                var theme = "light";
                try {
                    var saved = localStorage.getItem("theme");
                    theme =
                        saved === "light" || saved === "dark"
                            ? saved
                            : window.matchMedia("(prefers-color-scheme: dark)").matches
                              ? "dark"
                              : "light";
                } catch (e) {}
                document.documentElement.classList.toggle("dark", theme === "dark");
                document.documentElement.style.colorScheme = theme;
            })();
        </script>
    </head>
    <body>
        <!-- pm:body carries the crawler-readable content of a shell until React mounts; pm:data its preloaded data. -->
        <div id="root"><!--pm:body--><!--/pm:body--></div>
        <!--pm:data--><!--/pm:data-->
    </body>
</html>
