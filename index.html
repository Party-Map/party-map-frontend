<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
        <meta name="description" content="Find your place at the party with PartyMap!" />
        <meta name="theme-color" content="#6d28d9" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
        <title>PartyMap</title>
        <script>
            // Apply the saved theme before first paint to avoid a flash of the wrong colours.
            try {
                var saved = localStorage.getItem("theme");
                var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                document.documentElement.dataset.theme =
                    saved === "light" || saved === "dark" ? saved : prefersDark ? "dark" : "light";
            } catch (e) {
                document.documentElement.dataset.theme = "light";
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
